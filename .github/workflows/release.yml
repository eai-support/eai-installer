name: Release EAI Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Require release signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$WINDOWS_CERTIFICATE" || test "${{ matrix.os }}" != "windows-latest"
          test -n "$APPLE_CERTIFICATE" || test "${{ matrix.os }}" != "macos-latest"
      - name: Build signed bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: EAI Setup v__VERSION__
          releaseBody: Signed cross-platform EAI Setup bundle.
          releaseDraft: true
          prerelease: false
      - name: Add stable direct-download assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          case "${{ matrix.os }}" in
            windows-latest) cp src-tauri/target/release/bundle/nsis/*.exe release-assets/eai-setup-windows-x64.exe ;;
            macos-latest) cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/eai-setup-macos-arm64.dmg ;;
            ubuntu-22.04) cp src-tauri/target/release/bundle/deb/*.deb release-assets/eai-setup-ubuntu-amd64.deb ;;
          esac
          gh release upload "v${version}" release-assets/* --clobber
