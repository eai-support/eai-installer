name: Release EAI Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version, for example 0.1.3"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            asset: eai-setup-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            asset: eai-setup-windows-arm64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            asset: eai-setup-macos-arm64.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            asset: eai-setup-macos-x64.dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            asset: eai-setup-ubuntu-amd64.deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
            asset: eai-setup-ubuntu-arm64.deb
    runs-on: ${{ matrix.os }}
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget
      - run: npm test
      - name: Validate semantic release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$REQUESTED_VERSION" = "$package_version"
          else
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$tag_version" = "$package_version"
          fi
      - name: Require release signing configuration
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -n "$WINDOWS_CERTIFICATE" || { echo "Missing release secret WINDOWS_CERTIFICATE (base64 PFX)." >&2; exit 1; }
            test -n "$WINDOWS_CERTIFICATE_PASSWORD" || { echo "Missing release secret WINDOWS_CERTIFICATE_PASSWORD." >&2; exit 1; }
          fi
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            test -n "$APPLE_CERTIFICATE" || { echo "Missing release secret APPLE_CERTIFICATE (base64 Developer ID Application .p12)." >&2; exit 1; }
            test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "Missing release secret APPLE_CERTIFICATE_PASSWORD." >&2; exit 1; }
          fi
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            test -n "$APPLE_SIGNING_IDENTITY" || { echo "Missing release secret APPLE_SIGNING_IDENTITY." >&2; exit 1; }
            apple_id_ready=0
            api_key_ready=0
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then apple_id_ready=1; fi
            if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then api_key_ready=1; fi
            if [ "$apple_id_ready" -ne 1 ] && [ "$api_key_ready" -ne 1 ]; then
              echo "Configure Apple notarization with either APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID or APPLE_API_ISSUER/APPLE_API_KEY/APPLE_API_PRIVATE_KEY." >&2
              exit 1
            fi
          fi
      - name: Check Rust target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Prepare Apple notarization API key
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          fi
      - name: Build signed bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          projectPath: src-tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          tagName: v__VERSION__
          releaseName: EAI Setup v__VERSION__
          releaseBody: Signed cross-platform EAI Setup bundle.
          releaseDraft: true
          prerelease: false
      - name: Verify Gatekeeper-ready macOS bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target -type d -name '*.app' -print -quit)"
          dmg="$(scripts/find-valid-dmg.sh src-tauri/target)"
          test -n "$app"
          test -s "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$dmg"
      - name: Verify Authenticode signature
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target" -Recurse -Filter *.exe |
            Where-Object { $_.FullName -match '\\bundle\\nsis\\' } |
            Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer signature status is $($signature.Status): $($signature.StatusMessage)"
          }
          Write-Host "Authenticode publisher: $($signature.SignerCertificate.Subject)"
      - name: Add stable direct-download assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          if [ "${{ matrix.bundle }}" = "deb" ]; then
            bundle="$(scripts/find-valid-deb.sh src-tauri/target)"
          elif [ "${{ matrix.bundle }}" = "dmg" ]; then
            bundle="$(scripts/find-valid-dmg.sh src-tauri/target)"
          else
            bundle="$(find src-tauri/target -type f -path '*/bundle/${{ matrix.bundle }}/*' -print -quit)"
          fi
          test -s "$bundle"
          if [ "${{ matrix.bundle }}" = "dmg" ]; then
            hdiutil imageinfo "$bundle" >/dev/null
          fi
          cp "$bundle" "release-assets/${{ matrix.asset }}"
          gh release upload "v${version}" release-assets/* --clobber
