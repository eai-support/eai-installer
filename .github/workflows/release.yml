name: Release EAI Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version, for example 0.3.20"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-readiness-provenance:
    name: Require recent protected readiness for this tag commit
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bind version, immutable tag, and protected readiness run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          umask 077
          package_version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$REQUESTED_VERSION" = "$package_version"
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$version" = "$package_version"
          fi

          tag="v$version"
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          workflow_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          test "$tag_commit" = "$workflow_commit" || {
            echo "The immutable release tag does not resolve to this workflow commit." >&2
            exit 1
          }

          readiness_runs="$RUNNER_TEMP/release-readiness-runs.json"
          cutoff="$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release-readiness.yml \
            --branch main \
            --commit "$workflow_commit" \
            --event workflow_dispatch \
            --status success \
            --created ">=$cutoff" \
            --limit 100 \
            --json databaseId,conclusion,createdAt,displayTitle,headBranch,headSha \
            > "$readiness_runs"
          node - "$readiness_runs" "$version" "$workflow_commit" "$cutoff" <<'NODE'
          const fs = require("node:fs");
          const [file, version, commit, cutoff] = process.argv.slice(2);
          const runs = JSON.parse(fs.readFileSync(file, "utf8"));
          const title = new RegExp(`^Release readiness v${version.replaceAll(".", "\\.")} \\([A-Za-z0-9._-]{8,128}\\)$`);
          const valid = runs.filter((run) => run?.conclusion === "success"
            && run.headBranch === "main"
            && String(run.headSha).toLowerCase() === commit.toLowerCase()
            && run.createdAt >= cutoff
            && title.test(run.displayTitle ?? ""));
          if (valid.length < 1) {
            throw new Error("no recent successful protected readiness run is bound to this version and commit");
          }
          NODE

  build-windows:
    name: Build and stage unsigned Windows (${{ matrix.target }})
    needs: validate-readiness-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: eai-setup-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: eai-setup-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - name: Check Rust target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build Windows bundle without publishing
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          projectPath: src-tauri
          args: --ci --target ${{ matrix.target }} --bundles nsis
      - name: Stage exact unsigned Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned-release | Out-Null
          $bundles = @(Get-ChildItem -LiteralPath "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter *.exe -File)
          if ($bundles.Count -ne 1) { throw "Expected exactly one unsigned NSIS installer for the matrix target" }
          if ($bundles[0].Length -le 0) { throw "Unsigned NSIS installer is empty" }
          Copy-Item -LiteralPath $bundles[0].FullName -Destination "unsigned-release/${{ matrix.asset }}"
      - name: Upload exact unsigned Windows input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-release-${{ matrix.target }}
          path: unsigned-release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release-windows:
    name: Sign and verify Windows (${{ matrix.target }})
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: eai-setup-windows-x64.exe
            # NSIS installers are 32-bit bootstrapper PE files even when the
            # bundled application is x64. The build target/path above is the
            # architecture check for the payload; verify the signed wrapper's
            # architecture here instead of rejecting valid signed installers.
            pe_machine: "014C"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: eai-setup-windows-arm64.exe
            pe_machine: "014C"
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download exact unsigned Windows input
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-release-${{ matrix.target }}
          path: unsigned-release
      - name: Require one unsigned input and expected signer subject
        shell: pwsh
        env:
          AZURE_SIGNING_SUBJECT: ${{ vars.AZURE_SIGNING_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SIGNING_SUBJECT)) {
            throw "Missing release variable AZURE_SIGNING_SUBJECT"
          }
          $files = @(Get-ChildItem -LiteralPath unsigned-release -File)
          if ($files.Count -ne 1 -or $files[0].Name -cne '${{ matrix.asset }}' -or $files[0].Length -le 0) {
            throw "Unsigned Windows artifact did not contain the exact expected input"
          }
      - name: Sign Windows installer with Azure Artifact Signing
        uses: Azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply Windows Authenticode signature
        uses: Azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: eai-installer-signing
          certificate-profile-name: eai-installer-windows
          files-folder: unsigned-release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Stage exact stable release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staged-release | Out-Null
          Copy-Item -LiteralPath "unsigned-release/${{ matrix.asset }}" -Destination "staged-release/${{ matrix.asset }}"
      - name: Verify exact version, PE architecture, Authenticode signer, and RFC3161 timestamp
        shell: pwsh
        env:
          AZURE_SIGNING_SUBJECT: ${{ vars.AZURE_SIGNING_SUBJECT }}
        run: |
          $installer = Get-Item -LiteralPath "staged-release/${{ matrix.asset }}"
          if (-not $installer -or $installer.Length -le 0) { throw "Windows installer was not staged" }
          $expectedVersion = node -p "require('./package.json').version"
          try { $productVersion = [Version]$installer.VersionInfo.ProductVersion } catch { throw "Windows installer has an invalid ProductVersion" }
          if ($productVersion.ToString(3) -cne $expectedVersion) {
            throw "Windows installer ProductVersion does not match package.json"
          }
          $bytes = [IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes.Length -lt 64) { throw "Windows installer is too small to be a PE file" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $validPeHeader = $peOffset -ge 0 -and $peOffset + 6 -le $bytes.Length
          if ($validPeHeader) {
            $validPeHeader = $bytes[$peOffset] -eq 0x50 -and $bytes[$peOffset + 1] -eq 0x45 -and $bytes[$peOffset + 2] -eq 0 -and $bytes[$peOffset + 3] -eq 0
          }
          if (-not $validPeHeader) {
            throw "Windows installer has no valid PE header"
          }
          $actualMachine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expectedMachine = [Convert]::ToUInt16('${{ matrix.pe_machine }}', 16)
          if ($actualMachine -ne $expectedMachine) {
            throw ('Windows installer PE machine 0x{0:X4} does not match target 0x{1:X4}' -f $actualMachine, $expectedMachine)
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer signature status is $($signature.Status): $($signature.StatusMessage)"
          }
          if ($null -eq $signature.SignerCertificate) { throw "Windows installer has no signer certificate" }
          if ($signature.SignerCertificate.Subject -cne $env:AZURE_SIGNING_SUBJECT) {
            throw "Windows installer signer subject does not match AZURE_SIGNING_SUBJECT"
          }
          $signerEkus = @(
            foreach ($extension in $signature.SignerCertificate.Extensions) {
              if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
                foreach ($usage in $extension.EnhancedKeyUsages) { $usage.Value }
              }
            }
          )
          if ($signerEkus -notcontains '1.3.6.1.5.5.7.3.3') {
            throw "Windows signer certificate does not contain the Code Signing EKU"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "Windows installer has no verified timestamp certificate"
          }
          $timestampEkus = @(
            foreach ($extension in $signature.TimeStamperCertificate.Extensions) {
              if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
                foreach ($usage in $extension.EnhancedKeyUsages) { $usage.Value }
              }
            }
          )
          if ($timestampEkus -notcontains '1.3.6.1.5.5.7.3.8') {
            throw "Windows timestamp certificate does not contain the Time Stamping EKU"
          }
          Write-Host "Verified the exact Authenticode signer and timestamp on the staged installer."
      - name: Upload verified release asset to workflow storage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release-${{ matrix.target }}
          path: staged-release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release-apple:
    name: Build, sign, and verify macOS (${{ matrix.target }})
    needs: validate-readiness-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: eai-setup-macos-arm64.dmg
            bundle_arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: eai-setup-macos-x64.dmg
            bundle_arch: x86_64
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - name: Detect Apple signing configuration
        id: apple_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          apple_values=("$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY")
          apple_id_values=("$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID")
          api_values=("$APPLE_API_ISSUER" "$APPLE_API_KEY" "$APPLE_API_PRIVATE_KEY")
          apple_count=0; apple_id_count=0; api_count=0
          for value in "${apple_values[@]}"; do [ -n "$value" ] && apple_count=$((apple_count + 1)); done
          for value in "${apple_id_values[@]}"; do [ -n "$value" ] && apple_id_count=$((apple_id_count + 1)); done
          for value in "${api_values[@]}"; do [ -n "$value" ] && api_count=$((api_count + 1)); done
          if [ "$apple_count" -eq 0 ] && [ "$apple_id_count" -eq 0 ] && [ "$api_count" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing credentials are not configured; this release will label macOS assets unsigned."
            exit 0
          fi
          [ "$apple_count" -eq 3 ] || { echo "Apple Developer ID signing credentials are incomplete." >&2; exit 1; }
          if [ "$apple_id_count" -ne 0 ] && [ "$apple_id_count" -ne 3 ]; then
            echo "The Apple ID notarization credential set is only partially configured." >&2; exit 1
          fi
          if [ "$api_count" -ne 0 ] && [ "$api_count" -ne 3 ]; then
            echo "The App Store Connect API-key credential set is only partially configured." >&2; exit 1
          fi
          if [ "$apple_id_count" -ne 3 ] && [ "$api_count" -ne 3 ]; then
            echo "Configure one complete Apple notarization credential set." >&2; exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build notarized macOS bundle without publishing
        if: steps.apple_signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: src-tauri
          args: --ci --target ${{ matrix.target }} --bundles dmg

      - name: Build unsigned macOS bundle without publishing
        if: steps.apple_signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          projectPath: src-tauri
          args: --ci --target ${{ matrix.target }} --bundles dmg
      - name: Check Rust target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Prepare Apple notarization API key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          fi
      - name: Stage exact stable release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged-release
          bundle="$(scripts/find-valid-dmg.sh "src-tauri/target/${{ matrix.target }}/release/bundle/dmg")"
          test -s "$bundle"
          cp "$bundle" "staged-release/${{ matrix.asset }}"
          test -s "staged-release/${{ matrix.asset }}"
      - name: Verify Gatekeeper-ready macOS bundle
        if: steps.apple_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mount_dir="$(mktemp -d "$RUNNER_TEMP/eai-setup-dmg.XXXXXX")"
          mounted=0
          cleanup_mount() {
            if [ "$mounted" -eq 1 ]; then hdiutil detach "$mount_dir" -quiet || true; fi
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup_mount EXIT
          dmg="staged-release/${{ matrix.asset }}"
          test -s "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir" -quiet
          mounted=1
          apps=()
          while IFS= read -r -d '' app; do
            apps+=("$app")
          done < <(find "$mount_dir" -type d -name '*.app' -prune -print0)
          test "${#apps[@]}" -eq 1
          info_plist="${apps[0]}/Contents/Info.plist"
          test -f "$info_plist"
          expected_version="$(node -p "require('./package.json').version")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          test "$actual_version" = "$expected_version"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          [[ "$executable_name" =~ ^[A-Za-z0-9._+-]+$ ]]
          executable_path="${apps[0]}/Contents/MacOS/$executable_name"
          test -f "$executable_path" && test -x "$executable_path"
          test "$(lipo -archs "$executable_path")" = "${{ matrix.bundle_arch }}"
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"
          xcrun stapler validate "$dmg"
          hdiutil detach "$mount_dir" -quiet
          mounted=0
      - name: Verify unsigned macOS bundle metadata
        if: steps.apple_signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          dmg="staged-release/${{ matrix.asset }}"
          hdiutil imageinfo "$dmg" >/dev/null
          mount_dir="$RUNNER_TEMP/eai-setup-unsigned-mount"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir" -quiet
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          app="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$actual_version" = "$(node -p "require('./package.json').version")"
      - name: Upload verified release asset to workflow storage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release-${{ matrix.target }}
          path: staged-release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release-linux:
    name: Build, sign, and verify Linux (${{ matrix.target }})
    needs: validate-readiness-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: eai-setup-ubuntu-amd64.deb
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: eai-setup-ubuntu-arm64.deb
            deb_arch: arm64
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget \
            gnupg
      - run: npm test
      - name: Check Rust target
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build Linux bundle without publishing
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          projectPath: src-tauri
          args: --ci --target ${{ matrix.target }} --bundles deb
      - name: Stage exact stable release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged-release
          bundle="$(scripts/find-valid-deb.sh "src-tauri/target/${{ matrix.target }}/release/bundle/deb")"
          test -s "$bundle"
          cp "$bundle" "staged-release/${{ matrix.asset }}"
          test -s "staged-release/${{ matrix.asset }}"
      - name: Sign Debian package with the protected release key
        shell: bash
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
          LINUX_SIGNING_KEY_ID: ${{ vars.LINUX_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$LINUX_SIGNING_PRIVATE_KEY" || { echo "Missing release secret LINUX_SIGNING_PRIVATE_KEY." >&2; exit 1; }
          test -n "$LINUX_SIGNING_KEY_ID" || { echo "Missing release variable LINUX_SIGNING_KEY_ID." >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/eai-release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$LINUX_SIGNING_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --local-user "$LINUX_SIGNING_KEY_ID" --armor --detach-sign \
            --output "staged-release/${{ matrix.asset }}.asc" "staged-release/${{ matrix.asset }}"
          gpg --batch --verify "staged-release/${{ matrix.asset }}.asc" "staged-release/${{ matrix.asset }}"
          if [ "${{ matrix.deb_arch }}" = "amd64" ]; then
            gpg --batch --armor --export "$LINUX_SIGNING_KEY_ID" > staged-release/eai-linux-signing-key.asc
          fi
      - name: Verify staged Linux package
        shell: bash
        run: |
          set -euo pipefail
          package="staged-release/${{ matrix.asset }}"
          dpkg-deb --info "$package" >/dev/null
          test "$(dpkg-deb --field "$package" Package)" = "eai-setup"
          test "$(dpkg-deb --field "$package" Version)" = "$(node -p "require('./package.json').version")"
          test "$(dpkg-deb --field "$package" Architecture)" = "${{ matrix.deb_arch }}"
      - name: Upload verified release asset to workflow storage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release-${{ matrix.target }}
          path: staged-release/*
          if-no-files-found: error
          retention-days: 1

  publish-draft:
    name: Publish verified cross-platform draft
    needs: [release-windows, release-apple, release-linux]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download all verified release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: signed-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact cross-platform release set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(find release-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(
            eai-setup-macos-arm64.dmg
            eai-setup-macos-x64.dmg
            eai-setup-ubuntu-amd64.deb
            eai-setup-ubuntu-amd64.deb.asc
            eai-setup-ubuntu-arm64.deb
            eai-setup-ubuntu-arm64.deb.asc
            eai-linux-signing-key.asc
            eai-setup-windows-arm64.exe
            eai-setup-windows-x64.exe
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${#actual[@]}" -eq 9
          test "${actual[*]}" = "${expected[*]}"
          for asset in "${actual[@]}"; do test -s "release-assets/$asset"; done
          (cd release-assets && sha256sum --binary "${actual[@]}") > local-assets.sha256
      - name: Create draft and upload the exact verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$REQUESTED_VERSION" = "$version"
          else
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
          tag="v$version"
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          workflow_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          test "$tag_commit" = "$workflow_commit" || {
            echo "The immutable release tag does not resolve to this workflow commit." >&2
            exit 1
          }
          if gh release view "$tag" --json isDraft --jq '.isDraft' > existing-draft.txt 2>/dev/null; then
            test "$(cat existing-draft.txt)" = true
          else
            gh release create "$tag" \
              --target "$workflow_commit" \
              --draft \
              --title "EAI Setup v$version" \
              --notes "Windows installers are Microsoft Artifact Signed. Ubuntu .deb installers are accompanied by detached GPG signatures and the public release key. macOS installers are explicitly unsigned until Apple Developer ID credentials are configured."
          fi
          gh release upload "$tag" release-assets/* --clobber
          mapfile -t remote_names < <(gh release view "$tag" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          mapfile -t local_names < <(find release-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          test "${remote_names[*]}" = "${local_names[*]}"
          mkdir downloaded-assets
          gh release download "$tag" --dir downloaded-assets
          (cd downloaded-assets && sha256sum --check ../local-assets.sha256)
