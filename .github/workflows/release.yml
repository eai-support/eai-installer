name: Release EAI Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version, for example 0.1.2"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            asset: eai-setup-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            asset: eai-setup-windows-arm64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            asset: eai-setup-macos-arm64.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            asset: eai-setup-macos-x64.dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            asset: eai-setup-ubuntu-amd64.deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
            asset: eai-setup-ubuntu-arm64.deb
    runs-on: ${{ matrix.os }}
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Validate semantic release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$REQUESTED_VERSION" = "$package_version"
          else
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$tag_version" = "$package_version"
          fi
      - run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Require release signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$WINDOWS_CERTIFICATE" || test "${{ matrix.os }}" != "windows-latest"
          test -n "$APPLE_CERTIFICATE" || test "${{ matrix.os }}" != "macos-latest"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID" -a -n "$APPLE_PASSWORD" -a -n "$APPLE_TEAM_ID" \
              || test -n "$APPLE_API_ISSUER" -a -n "$APPLE_API_KEY" -a -n "$APPLE_API_PRIVATE_KEY"
          fi
      - name: Prepare Apple notarization API key
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          fi
      - name: Build signed bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          projectPath: src-tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          tagName: v__VERSION__
          releaseName: EAI Setup v__VERSION__
          releaseBody: Signed cross-platform EAI Setup bundle.
          releaseDraft: true
          prerelease: false
      - name: Verify Gatekeeper-ready macOS bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target -type d -name '*.app' -print -quit)"
          dmg="$(scripts/find-valid-dmg.sh src-tauri/target)"
          test -n "$app"
          test -s "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$dmg"
      - name: Add stable direct-download assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          if [ "${{ matrix.bundle }}" = "deb" ]; then
            bundle="$(scripts/find-valid-deb.sh src-tauri/target)"
          elif [ "${{ matrix.bundle }}" = "dmg" ]; then
            bundle="$(scripts/find-valid-dmg.sh src-tauri/target)"
          else
            bundle="$(find src-tauri/target -type f -path '*/bundle/${{ matrix.bundle }}/*' -print -quit)"
          fi
          test -s "$bundle"
          if [ "${{ matrix.bundle }}" = "dmg" ]; then
            hdiutil imageinfo "$bundle" >/dev/null
          fi
          cp "$bundle" "release-assets/${{ matrix.asset }}"
          gh release upload "v${version}" release-assets/* --clobber
