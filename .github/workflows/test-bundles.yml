name: Test installer bundles

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: eai-setup-windows
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            artifact: eai-setup-windows-arm64
          - label: macOS
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: eai-setup-macos
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: eai-setup-macos-x64
          - label: Ubuntu
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact: eai-setup-ubuntu-amd64
          - label: Ubuntu ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
            artifact: eai-setup-ubuntu-arm64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Ubuntu Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT=libwebkit2gtk-4.1-dev
          else
            WEBKIT=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y "$WEBKIT" libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential

      - name: Validate source
        run: npm test

      - name: Test native Windows prerequisite detection
        if: matrix.label == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build unsigned test bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target" -Recurse -Filter *.exe | Where-Object { $_.FullName -match '\\bundle\\nsis\\' } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          Get-FileHash $installer.FullName -Algorithm SHA256
          $installDir = Join-Path $env:RUNNER_TEMP "eai-setup-installed"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          & $installer.FullName /S "/D=$installDir"
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Windows installer exited with code $LASTEXITCODE" }
          $roots = @(
            $installDir,
            (Join-Path $env:LOCALAPPDATA 'EAI Setup'),
            (Join-Path $env:LOCALAPPDATA 'Programs\EAI Setup'),
            (Join-Path $env:ProgramFiles 'EAI Setup')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Unique
          $installed = @()
          for ($attempt = 0; $attempt -lt 10 -and $installed.Count -eq 0; $attempt++) {
            $roots = @(
              $installDir,
              (Join-Path $env:LOCALAPPDATA 'EAI Setup'),
              (Join-Path $env:LOCALAPPDATA 'Programs\EAI Setup'),
              (Join-Path $env:ProgramFiles 'EAI Setup')
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Unique
            $installed = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File | Where-Object { $_.Extension -ieq '.exe' } })
            if ($installed.Count -eq 0) { Start-Sleep -Seconds 1 }
          }
          $installed | Select-Object FullName, Length
          if ($installed.Count -eq 0) { throw "Windows installer did not create an executable in the expected install roots" }

      - name: Smoke-test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(scripts/find-valid-dmg.sh src-tauri/target)"
          test -s "$dmg"
          hdiutil imageinfo "$dmg" >/dev/null
          mount="$RUNNER_TEMP/eai-setup-mount"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          test -n "$(find "$app/Contents/MacOS" -type f -perm -111 -print -quit)"
          chmod +x scripts/test-macos-dev.sh
          scripts/test-macos-dev.sh "$app"

      - name: Smoke-test Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(scripts/find-valid-deb.sh src-tauri/target)"
          deb="$(realpath "$deb")"
          package="$(dpkg-deb -f "$deb" Package)"
          sudo apt-get install -y "$deb"
          test "$(dpkg-query -W -f='${Status}' "$package")" = "install ok installed"
          test -x /usr/bin/eai-setup
          sudo apt-get remove -y "$package"

      - name: Upload test installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  verify-downloads:
    name: Verify downloaded test installers
    needs: build-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v5
        with:
          path: downloaded

      - name: Check downloaded files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t windows < <(find downloaded -type f -name '*.exe' -print)
          mapfile -t macos < <(find downloaded -type f -name '*.dmg' -print)
          mapfile -t ubuntu < <(find downloaded -type f -name '*.deb' -print)
          test "${#windows[@]}" -ge 2
          test "${#macos[@]}" -ge 2
          test "${#ubuntu[@]}" -ge 2
          sha256sum "${windows[@]}" "${macos[@]}" "${ubuntu[@]}"
          for deb in "${ubuntu[@]}"; do
            dpkg-deb --info "$deb" >/dev/null
            dpkg-deb --contents "$deb" | awk '$NF ~ /(^|\/)usr\/bin\/eai-setup$/ { found = 1 } END { exit found ? 0 : 1 }'
          done
