name: Release signing readiness
run-name: Release readiness v${{ inputs.version }} (${{ inputs.nonce }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic release version, for example 0.3.20"
        required: true
        type: string
      nonce:
        description: "Non-secret caller correlation value"
        required: true
        type: string

# This workflow deliberately cannot create tags, releases, repository content,
# or tenant data. It verifies protected signing configuration before release.sh
# pushes an immutable version tag. The later release matrix remains responsible
# for proving Azure's signing data plane with the actual Windows installers.
permissions:
  contents: read

jobs:
  validate-input:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate requested version and correlation nonce
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          READINESS_NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$READINESS_NONCE" =~ ^[A-Za-z0-9._-]{8,128}$ ]]
          test "$REQUESTED_VERSION" = "$(node -p "require('./package.json').version")"

  apple-readiness:
    name: Validate Apple signing and notarization
    needs: validate-input
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Validate Developer ID certificate and notarization credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$APPLE_CERTIFICATE" || { echo "Missing release secret APPLE_CERTIFICATE." >&2; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "Missing release secret APPLE_CERTIFICATE_PASSWORD." >&2; exit 1; }
          test -n "$APPLE_SIGNING_IDENTITY" || { echo "Missing release secret APPLE_SIGNING_IDENTITY." >&2; exit 1; }
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) echo "APPLE_SIGNING_IDENTITY must name a Developer ID Application identity." >&2; exit 1 ;;
          esac

          certificate_file="$RUNNER_TEMP/apple-developer-id.p12"
          certificate_pem="$RUNNER_TEMP/apple-developer-id.pem"
          keychain="$RUNNER_TEMP/release-readiness.keychain-db"
          keychain_password="release-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          signed_probe="$RUNNER_TEMP/readiness-signing-probe"
          notarization_history="$RUNNER_TEMP/notarization-history.json"
          private_key_file="$RUNNER_TEMP/apple-notarization-key.p8"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate_file" "$certificate_pem" "$signed_probe" \
              "$notarization_history" "$private_key_file"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_file"
          test -s "$certificate_file"
          openssl pkcs12 -in "$certificate_file" \
            -passin env:APPLE_CERTIFICATE_PASSWORD -clcerts -nokeys \
            -out "$certificate_pem" >/dev/null 2>&1
          test -s "$certificate_pem"

          # Require a currently valid certificate with at least seven days of
          # remaining validity, the exact configured common name, and a code
          # signing EKU before importing any private key.
          openssl x509 -in "$certificate_pem" -noout -checkend 604800
          certificate_common_name="$(
            openssl x509 -in "$certificate_pem" -noout -subject -nameopt multiline |
              sed -nE 's/^[[:space:]]*commonName[[:space:]]*=[[:space:]]*(.*)$/\1/p'
          )"
          test "$certificate_common_name" = "$APPLE_SIGNING_IDENTITY" || {
            echo "APPLE_SIGNING_IDENTITY does not exactly match the certificate common name." >&2
            exit 1
          }
          certificate_team_id="$(
            openssl x509 -in "$certificate_pem" -noout -subject -nameopt multiline |
              sed -nE 's/^[[:space:]]*organizationalUnitName[[:space:]]*=[[:space:]]*(.*)$/\1/p'
          )"
          identity_team_id="$(printf '%s\n' "$APPLE_SIGNING_IDENTITY" | sed -nE 's/^Developer ID Application: .+ \(([A-Z0-9]+)\)$/\1/p')"
          test -n "$identity_team_id" && test "$certificate_team_id" = "$identity_team_id" || {
            echo "The Developer ID identity and certificate team identifiers do not match." >&2
            exit 1
          }
          certificate_text="$(openssl x509 -in "$certificate_pem" -noout -text)"
          grep -Fq "Code Signing" <<< "$certificate_text" || {
              echo "The Apple certificate does not contain the Code Signing extended key usage." >&2
              exit 1
            }

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate_file" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null

          identities="$(security find-identity -v -p codesigning "$keychain")"
          identity_count="$(printf '%s\n' "$identities" | grep -F -c "\"$APPLE_SIGNING_IDENTITY\"" || true)"
          test "$identity_count" -eq 1 || {
            echo "The protected P12 must expose exactly one matching usable signing identity." >&2
            exit 1
          }
          security verify-cert -c "$certificate_pem" -k "$keychain" \
            -p codeSign -R ocsp -R require -q

          cp /usr/bin/true "$signed_probe"
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --sign "$APPLE_SIGNING_IDENTITY" "$signed_probe"
          codesign --verify --strict --verbose=2 "$signed_probe"
          codesign_details="$(codesign --display --verbose=4 "$signed_probe" 2>&1)"
          grep -Eq '^Timestamp=' <<< "$codesign_details" || {
            echo "The ephemeral Developer ID signature has no secure timestamp." >&2
            exit 1
          }

          apple_id_complete=0
          api_key_complete=0
          apple_id_value_count=0
          api_key_value_count=0
          for value in "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"; do
            if [ -n "$value" ]; then apple_id_value_count=$((apple_id_value_count + 1)); fi
          done
          for value in "$APPLE_API_ISSUER" "$APPLE_API_KEY" "$APPLE_API_PRIVATE_KEY"; do
            if [ -n "$value" ]; then api_key_value_count=$((api_key_value_count + 1)); fi
          done
          if [ "$apple_id_value_count" -ne 0 ] && [ "$apple_id_value_count" -ne 3 ]; then
            echo "The Apple ID notarization credential set is only partially configured." >&2
            exit 1
          fi
          if [ "$api_key_value_count" -ne 0 ] && [ "$api_key_value_count" -ne 3 ]; then
            echo "The App Store Connect API-key credential set is only partially configured." >&2
            exit 1
          fi
          if [ "$apple_id_value_count" -eq 3 ]; then
            apple_id_complete=1
          fi
          if [ "$api_key_value_count" -eq 3 ]; then
            api_key_complete=1
          fi
          if [ "$apple_id_complete" -ne 1 ] && [ "$api_key_complete" -ne 1 ]; then
            echo "Configure one complete Apple notarization credential set." >&2
            exit 1
          fi

          if [ "$api_key_complete" -eq 1 ]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$private_key_file"
            openssl pkey -in "$private_key_file" -check -noout >/dev/null
            xcrun notarytool history \
              --key "$private_key_file" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --output-format json > "$notarization_history"
          else
            test "$certificate_team_id" = "$APPLE_TEAM_ID" || {
              echo "APPLE_TEAM_ID does not match the Developer ID certificate team." >&2
              exit 1
            }
            xcrun notarytool history \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json > "$notarization_history"
          fi
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' \
            "$notarization_history"

      - name: Record Apple readiness scope
        run: echo "Developer ID identity, certificate lifetime/chain/revocation, timestamped signing, and notarization authentication passed without submitting a release artifact."

  azure-readiness:
    name: Validate Azure Artifact Signing control plane
    needs: validate-input
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require Azure workload identity variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_RESOURCE_GROUP: ${{ vars.AZURE_SIGNING_RESOURCE_GROUP }}
          AZURE_SIGNING_SUBJECT: ${{ vars.AZURE_SIGNING_SUBJECT }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID" || { echo "Missing release variable AZURE_CLIENT_ID." >&2; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "Missing release variable AZURE_TENANT_ID." >&2; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "Missing release variable AZURE_SUBSCRIPTION_ID." >&2; exit 1; }
          test -n "$AZURE_SIGNING_RESOURCE_GROUP" || { echo "Missing release variable AZURE_SIGNING_RESOURCE_GROUP." >&2; exit 1; }
          test -n "$AZURE_SIGNING_SUBJECT" || { echo "Missing release variable AZURE_SIGNING_SUBJECT." >&2; exit 1; }
          test "${#AZURE_SIGNING_RESOURCE_GROUP}" -le 90
          [[ "$AZURE_SIGNING_RESOURCE_GROUP" != */* && "$AZURE_SIGNING_RESOURCE_GROUP" != *$'\n'* && "$AZURE_SIGNING_RESOURCE_GROUP" != *. ]]
      - name: Authenticate the protected Azure signing identity
        uses: Azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate exact signing account, profile, and signer role
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_RESOURCE_GROUP: ${{ vars.AZURE_SIGNING_RESOURCE_GROUP }}
          SIGNING_ACCOUNT_NAME: eai-installer-signing
          SIGNING_PROFILE_NAME: eai-installer-windows
          SIGNER_ROLE_DEFINITION_ID: 2837e146-70d7-4cfd-ad55-7efa6464f958
        run: |
          set -euo pipefail
          umask 077

          actual_subscription="$(az account show --query id --output tsv)"
          test "$actual_subscription" = "$AZURE_SUBSCRIPTION_ID"

          account_json="$RUNNER_TEMP/signing-account.json"
          profile_json="$RUNNER_TEMP/signing-profile.json"
          role_json="$RUNNER_TEMP/signing-role-assignments.json"
          account_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_SIGNING_RESOURCE_GROUP/providers/Microsoft.CodeSigning/codeSigningAccounts/$SIGNING_ACCOUNT_NAME"
          az resource show --ids "$account_id" --api-version 2025-10-13 \
            --output json > "$account_json"
          node - "$account_json" "$account_id" "$SIGNING_ACCOUNT_NAME" <<'NODE'
          const fs = require("node:fs");
          const [file, expectedId, expectedName] = process.argv.slice(2);
          const account = JSON.parse(fs.readFileSync(file, "utf8"));
          if (String(account.id).toLowerCase() !== expectedId.toLowerCase()) throw new Error("wrong signing account ID");
          if (account.name !== expectedName) throw new Error("wrong signing account name");
          if (String(account.type).toLowerCase() !== "microsoft.codesigning/codesigningaccounts") {
            throw new Error("unexpected signing account resource type");
          }
          if (String(account.location).replace(/[^a-z]/gi, "").toLowerCase() !== "northeurope") {
            throw new Error("signing account is not in North Europe");
          }
          const properties = account.properties ?? {};
          if (String(properties.provisioningState).toLowerCase() !== "succeeded") {
            throw new Error("signing account provisioning has not succeeded");
          }
          if (properties.accountUri !== "https://neu.codesigning.azure.net/") {
            throw new Error("signing account URI does not match the release endpoint");
          }
          if (!["basic", "premium"].includes(String(properties.sku?.name).toLowerCase())) {
            throw new Error("signing account has an unsupported SKU");
          }
          NODE

          profile_id="$account_id/certificateProfiles/$SIGNING_PROFILE_NAME"
          az resource show --ids "$profile_id" --api-version 2025-10-13 \
            --output json > "$profile_json"
          node - "$profile_json" "$profile_id" "$SIGNING_PROFILE_NAME" <<'NODE'
          const fs = require("node:fs");
          const [file, expectedId, expectedName] = process.argv.slice(2);
          const profile = JSON.parse(fs.readFileSync(file, "utf8"));
          if (String(profile.id).toLowerCase() !== expectedId.toLowerCase()) throw new Error("wrong certificate profile ID");
          if (String(profile.name).split("/").at(-1) !== expectedName) throw new Error("wrong certificate profile name");
          if (String(profile.type).toLowerCase() !== "microsoft.codesigning/codesigningaccounts/certificateprofiles") {
            throw new Error("unexpected certificate profile resource type");
          }
          const properties = profile.properties ?? {};
          if (String(properties.profileType).toLowerCase() !== "publictrust") throw new Error("profile is not PublicTrust");
          if (!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(properties.identityValidationId ?? "")) {
            throw new Error("profile has no valid identity-validation ID");
          }
          if (String(properties.status).toLowerCase() !== "active") throw new Error("certificate profile is not Active");
          if (String(properties.provisioningState).toLowerCase() !== "succeeded") {
            throw new Error("certificate profile provisioning has not succeeded");
          }
          NODE

          principal_oid="$(
            az account get-access-token \
              --resource https://management.azure.com/ \
              --query accessToken --output tsv |
              node -e '
                let token = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { token += chunk; });
                process.stdin.on("end", () => {
                  const encoded = token.trim().split(".")[1];
                  if (!encoded) throw new Error("Azure returned an invalid access token");
                  const claims = JSON.parse(Buffer.from(encoded, "base64url").toString("utf8"));
                  if (!/^[0-9a-f-]{36}$/i.test(claims.oid ?? "")) throw new Error("Azure token has no principal object ID");
                  process.stdout.write(claims.oid);
                });'
          )"
          az role assignment list \
            --assignee-object-id "$principal_oid" \
            --scope "$profile_id" \
            --include-inherited \
            --fill-principal-name false \
            --fill-role-definition-name false \
            --role "$SIGNER_ROLE_DEFINITION_ID" \
            --output json > "$role_json"
          node - "$role_json" "$profile_id" "$principal_oid" "$SIGNER_ROLE_DEFINITION_ID" <<'NODE'
          const fs = require("node:fs");
          const [file, profileId, principalId, roleDefinitionId] = process.argv.slice(2);
          const assignments = JSON.parse(fs.readFileSync(file, "utf8"));
          const normalizedProfile = profileId.toLowerCase();
          const matching = assignments.filter((assignment) => {
            const scope = String(assignment.scope ?? "").toLowerCase().replace(/\/$/, "");
            const assignedRole = String(assignment.roleDefinitionId ?? "").split("/").at(-1).toLowerCase();
            return String(assignment.principalId).toLowerCase() === principalId.toLowerCase()
              && assignedRole === roleDefinitionId.toLowerCase()
              && (normalizedProfile === scope || normalizedProfile.startsWith(`${scope}/`));
          });
          if (matching.length < 1) throw new Error("release identity lacks a direct or inherited Artifact Signing Certificate Profile Signer assignment");
          NODE

      - name: Record Azure readiness scope and limitation
        run: |
          echo "Azure OIDC, subscription, exact North Europe account/profile state, identity validation, and directly assigned signer RBAC passed."
          echo "No signing request was submitted: the post-tag Windows matrix signature is the authoritative Azure data-plane proof."

  readiness:
    name: Protected release readiness passed
    needs: [apple-readiness, azure-readiness]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - run: echo "Protected non-publishing signing readiness passed; only temporary runner files and non-mutating credential/service checks were used. No tag, release, tenant, Azure-resource, or notarization-submission mutation was attempted."
