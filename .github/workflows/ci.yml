name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - run: bash -n scripts/bootstrap.sh scripts/release-preflight.sh
      - run: node --check ui/app.js

  tauri-check:
    # Match the supported x64 Linux release target. ubuntu-latest can move to
    # a newer image before the installer support policy and Tauri dependencies.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT=libwebkit2gtk-4.1-dev
          else
            WEBKIT=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y "$WEBKIT" libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
