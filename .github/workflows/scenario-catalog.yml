name: Scenario catalog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run scenario-catalog

      - run: node scripts/test-scenario-catalog.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: scenario-catalog
          path: artifacts/scenario-catalog.json
          if-no-files-found: error
