name: Publish test installer release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Unique test version, for example 0.1.0-pr9"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }} test release asset
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: eai-test-windows
            asset: eai-setup-windows-x64.exe
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            artifact: eai-test-windows-arm64
            asset: eai-setup-windows-arm64.exe
          - label: macOS
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: eai-test-macos
            asset: eai-setup-macos-arm64.dmg
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: eai-test-macos-x64
            asset: eai-setup-macos-x64.dmg
          - label: Ubuntu
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact: eai-test-ubuntu-amd64
            asset: eai-setup-ubuntu-amd64.deb
          - label: Ubuntu ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
            artifact: eai-test-ubuntu-arm64
            asset: eai-setup-ubuntu-arm64.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Ubuntu Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT=libwebkit2gtk-4.1-dev
          else
            WEBKIT=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y "$WEBKIT" libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential

      - name: Validate source
        run: npm test

      - name: Build unsigned test bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target" -Recurse -Filter *.exe | Where-Object { $_.FullName -match '\\bundle\\nsis\\' } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          $installDir = Join-Path $env:RUNNER_TEMP "eai-setup-installed"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          & $installer.FullName /S "/D=$installDir"
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Windows installer exited with code $LASTEXITCODE" }
          $roots = @($installDir, (Join-Path $env:LOCALAPPDATA 'EAI Setup'), (Join-Path $env:LOCALAPPDATA 'Programs\EAI Setup'), (Join-Path $env:ProgramFiles 'EAI Setup')) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Unique
          $installed = @()
          for ($attempt = 0; $attempt -lt 10 -and $installed.Count -eq 0; $attempt++) {
            $installed = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File | Where-Object { $_.Extension -ieq '.exe' } })
            if ($installed.Count -eq 0) { Start-Sleep -Seconds 1 }
          }
          if ($installed.Count -eq 0) { throw "Windows installer did not create an executable" }

      - name: Smoke-test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          test -s "$dmg"
          mount="$RUNNER_TEMP/eai-setup-mount"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          test -n "$(find "$app/Contents/MacOS" -type f -perm -111 -print -quit)"
          chmod +x scripts/test-macos-dev.sh
          scripts/test-macos-dev.sh "$app"

      - name: Smoke-test Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(scripts/find-valid-deb.sh src-tauri/target)"
          deb="$(realpath "$deb")"
          package="$(dpkg-deb -f "$deb" Package)"
          sudo apt-get install -y "$deb"
          test "$(dpkg-query -W -f='${Status}' "$package")" = "install ok installed"
          test -x /usr/bin/eai-setup
          sudo apt-get remove -y "$package"

      - name: Normalize release asset name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          if [ "${{ matrix.bundle }}" = "deb" ]; then
            source="$(scripts/find-valid-deb.sh src-tauri/target)"
          else
            source="$(find src-tauri/target -type f -path '*/bundle/${{ matrix.bundle }}/*' -print -quit)"
          fi
          test -s "$source"
          cp "$source" "release-asset/${{ matrix.asset }}"

      - name: Upload normalized release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-asset/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish direct-download test assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download normalized assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify normalized Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ubuntu < <(find release-assets -type f -name '*.deb' -print)
          test "${#ubuntu[@]}" -eq 2
          for deb in "${ubuntu[@]}"; do
            dpkg-deb --info "$deb" >/dev/null
            dpkg-deb --contents "$deb" | grep -q './usr/bin/eai-setup'
          done

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="eai-setup-test-v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EAI Setup test ${VERSION}" \
              --notes "Unsigned test installers. Use only for controlled validation; this is not a production release." \
              --prerelease
          fi
