[package]
name = "eai-setup"
version = "0.3.25"
description = "EAI Setup desktop bootstrapper"
authors = ["Enterprise AI Group"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[features]
# Local templates can execute repository-controlled setup scripts. Keep that
# capability out of production artifacts and opt into it only for controlled
# debug/E2E builds.
e2e-local-template = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
